services:

  # ------------------ MYSQL ------------------
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------ EUREKA SERVER ------------------
  service-registry:
    build: ./service-registry-app
    container_name: service-registry-container
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=uat
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------ CONFIG SERVER ------------------
  config-server:
    build: ./config-server
    container_name: config-server-container
    ports:
      - "8087:8087"
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=uat
    depends_on:
      service-registry:
        condition: service_started

  # ------------------ QUIZ SERVICE ------------------
  quiz-service:
    build: ./quiz-service
    container_name: quiz-service-container
    ports:
      - "8081:8081"
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=uat
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  # ------------------ QUESTION SERVICE ------------------
  question-service:
    build: ./questions-service
    container_name: question-service-container
    ports:
      - "8082:8082"
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=uat
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  # ------------------ API GATEWAY ------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway-container
    ports:
      - "9090:9090"
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=mobile-app
    depends_on:
      quiz-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
#      keycloak:
#        condition: service_healthy


  # ------------------ zookeeper ------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-container
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  # ------------------ kafka ------------------

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-container
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    networks:
      - microservices-net
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-container:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-container:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


# ------------------ NETWORK ------------------
networks:
  microservices-net:
    external: true
